name: Deploy datazines to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault
          fetch-depth: 0

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Overlay press files
        run: |
          cp vault/press/quartz.config.yaml quartz/quartz.config.yaml
          cp vault/press/quartz/styles/custom.scss quartz/quartz/styles/custom.scss
          cp vault/press/quartz/styles/variables.scss quartz/quartz/styles/variables.scss
          cp vault/press/quartz/components/Head.tsx quartz/quartz/components/Head.tsx
          cp vault/press/quartz/plugins/emitters/componentResources.ts quartz/quartz/plugins/emitters/componentResources.ts
          cp vault/press/fix-asset-paths.py quartz/fix-asset-paths.py
          rm -rf quartz/content
          ln -s "$GITHUB_WORKSPACE/vault" quartz/content

      - name: Install and build
        working-directory: quartz
        run: |
          npm ci
          npx quartz plugin install
          npx quartz build
          python3 fix-asset-paths.py
          touch public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
