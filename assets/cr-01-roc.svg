<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="ROC curve anatomy: ranking and thresholds">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="38" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">ROC sweeps every cut from 1.0 down to 0.0.</text>

<!-- Main square box -->
<g transform="translate(180, 70)">
  <rect width="280" height="280" fill="#f4efe4" stroke="#241c14" stroke-width="1.8"/>
  <path d="M 0,280 L 280,0" stroke="#7a6e5e" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Curve -->
  <path d="M 0,280 L 0,80 Q 50,20 280,0" fill="none" stroke="#3d5f86" stroke-width="2.5"/>
  
  <!-- Key points -->
  <circle cx="0" cy="280" r="5" fill="#241c14"/>
  <text x="10" y="275" font-family="Georgia" font-size="12" fill="#241c14">cut = 1.0 (say no to all)</text>
  
  <circle cx="280" cy="0" r="5" fill="#241c14"/>
  <text x="270" y="15" font-family="Georgia" font-size="12" fill="#241c14" text-anchor="end">cut = 0.0 (say yes to all)</text>
  
  <circle cx="50" cy="35" r="6" fill="#b44a28"/>
  <text x="60" y="55" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#b44a28">cut = 0.5 (sweet spot)</text>

  <!-- Labels -->
  <text x="140" y="305" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#241c14" text-anchor="middle">False Positive Rate (FP / All Real No)</text>
  <text x="-20" y="140" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#241c14" text-anchor="middle" transform="rotate(-90 -20 140)">True Positive Rate (TP / All Real Yes)</text>
</g>

<!-- Explanatory note on right -->
<rect x="500" y="120" width="220" height="180" rx="8" ry="8" fill="#f4efe4" stroke="#4f6d55" stroke-width="1.5"/>
<text x="610" y="145" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#4f6d55" text-anchor="middle">What AUC really means</text>
<text x="515" y="175" font-family="Georgia" font-size="13" fill="#241c14">AUC = 0.84 means:</text>
<text x="515" y="200" font-family="Georgia" font-size="13" fill="#241c14">Pick 1 random passer,</text>
<text x="515" y="220" font-family="Georgia" font-size="13" fill="#241c14">pick 1 random failer.</text>
<text x="515" y="250" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#3d5f86">84% chance the passer</text>
<text x="515" y="270" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#3d5f86">got a higher score.</text>
</svg>