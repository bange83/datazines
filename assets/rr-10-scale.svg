<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="scale before you ridge">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="400" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="400" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380.0" y="48.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#7a6e5e" text-anchor="middle" font-style="normal" font-weight="normal">ridge punishes big numbers. units matter.</text>
<ellipse cx="200" cy="190" rx="70" ry="70" fill="none" stroke="#4f6d55" stroke-width="2.2"/>
<text x="200.0" y="198.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="28" fill="#4f6d55" text-anchor="middle" font-style="normal" font-weight="normal">b = 1</text>
<text x="200.0" y="290.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#241c14" text-anchor="middle" font-style="normal" font-weight="normal">hours  (1–6)</text>
<text x="200.0" y="318.0" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#7a6e5e" text-anchor="middle" font-style="normal" font-weight="normal">small number, quiet tax</text>
<ellipse cx="560" cy="190" rx="70" ry="70" fill="none" stroke="#b44a28" stroke-width="2.2"/>
<text x="560.0" y="198.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="28" fill="#b44a28" text-anchor="middle" font-style="normal" font-weight="normal">b = 0.02</text>
<text x="560.0" y="290.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#241c14" text-anchor="middle" font-style="normal" font-weight="normal">minutes  (60–360)</text>
<text x="560.0" y="318.0" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#7a6e5e" text-anchor="middle" font-style="normal" font-weight="normal">tiny b — or huge, if you swap units</text>
<text x="380.0" y="370.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#3d5f86" text-anchor="middle" font-style="normal" font-weight="normal">scale every x first. then the tax is fair.</text>
</svg>
