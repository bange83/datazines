<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="tree 2 fits y minus P, not a 0/1 miss">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="340" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="340" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>

<text x="380" y="36" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">they failed. tree 1 still leaned pass. leftover is a pull, not a 0.</text>

<!-- tree 1 -->
<rect x="40" y="70" width="200" height="200" rx="12" fill="#efe6d4" stroke="#b44a28" stroke-width="2"/>
<text x="140" y="108" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="middle">tree 1</text>
<text x="140" y="150" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#241c14" text-anchor="middle">score +0.5</text>
<text x="140" y="178" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">P(pass) ≈ 0.62</text>
<text x="140" y="220" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle">truth: fail  (y = 0)</text>

<path d="M 250,170 L 330,170" fill="none" stroke="#c4a35a" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 314,162 L 332,170 L 314,178" fill="none" stroke="#c4a35a" stroke-width="2.2" stroke-linecap="round"/>
<text x="290" y="154" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#c4a35a" text-anchor="middle">y − P</text>

<!-- leftover -->
<rect x="340" y="70" width="180" height="200" rx="12" fill="#efe6d4" stroke="#c4a35a" stroke-width="2"/>
<text x="430" y="108" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#c4a35a" text-anchor="middle">leftover</text>
<text x="430" y="165" font-family="Georgia, Times New Roman, serif" font-size="22" fill="#c4a35a" text-anchor="middle">−0.62</text>
<text x="430" y="210" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#7a6e5e" text-anchor="middle">pull toward fail</text>
<text x="430" y="236" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#7a6e5e" text-anchor="middle">not “missed by 1”</text>

<path d="M 530,170 L 610,170" fill="none" stroke="#3d5f86" stroke-width="2.4" stroke-linecap="round"/>
<path d="M 594,162 L 612,170 L 594,178" fill="none" stroke="#3d5f86" stroke-width="2.2" stroke-linecap="round"/>

<!-- tree 2 -->
<rect x="620" y="70" width="100" height="200" rx="12" fill="#efe6d4" stroke="#3d5f86" stroke-width="2"/>
<text x="670" y="130" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#3d5f86" text-anchor="middle">tree 2</text>
<text x="670" y="175" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#241c14" text-anchor="middle">fits</text>
<text x="670" y="200" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#3d5f86" text-anchor="middle">−0.62</text>

<text x="380" y="310" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">then shrink that tree and add it. leftover of a sum, not a second 0/1 label.</text>
</svg>
