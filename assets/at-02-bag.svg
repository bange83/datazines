<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="a bag smears coffee into the study huddle">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="380" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="380" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380.0" y="40.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">bag = average. everyone gets 1/3.</text>
<ellipse cx="160.0" cy="210.0" rx="8" ry="8" transform="rotate(0 160.0 210.0)" fill="#c4a35a" stroke="#c4a35a" stroke-width="0" opacity="0.95"/>
<text x="160.0" y="248.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#c4a35a" text-anchor="middle">coffee</text>
<ellipse cx="480.0" cy="140.0" rx="8" ry="8" transform="rotate(0 480.0 140.0)" fill="#b44a28" stroke="#b44a28" stroke-width="0" opacity="0.95"/>
<text x="480.0" y="122.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="middle">study</text>
<ellipse cx="560.0" cy="160.0" rx="8" ry="8" transform="rotate(0 560.0 160.0)" fill="#4f6d55" stroke="#4f6d55" stroke-width="0" opacity="0.95"/>
<text x="575.0" y="188.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#4f6d55" text-anchor="start">hours</text>
<ellipse cx="380.0" cy="210.0" rx="16" ry="14" transform="rotate(-8 380.0 210.0)" fill="#c4a35a" stroke="#7a6e5e" stroke-width="2" opacity="0.55"/>
<text x="380.0" y="280.0" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#7a6e5e" text-anchor="middle">bag  (3.09, −0.03)</text>
