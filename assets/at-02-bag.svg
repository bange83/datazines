<path d="M 548.0,168.0 L 396.0,204.0" fill="none" stroke="#7a6e5e" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
<text x="380.0" y="340.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle">coffee got dragged into the study huddle. it did not ask to be.</text>
