<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="a table of how good each act is from each state">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="340" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="340" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="36" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#7a6e5e" text-anchor="middle">after 400 weeks of try-and-nudge.</text>
<text x="280" y="90" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">rest</text>
<text x="480" y="90" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">study</text>
<text x="90" y="150" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="start">tired</text>
<text x="90" y="230" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#3d5f86" text-anchor="start">fresh</text>
<rect x="180" y="115" width="180" height="70" rx="8" fill="#4f6d55" opacity="0.18" stroke="#4f6d55" stroke-width="2"/>
<text x="270" y="158" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#4f6d55" text-anchor="middle">18.9</text>
<rect x="390" y="115" width="180" height="70" rx="8" fill="#7a6e5e" opacity="0.10" stroke="#7a6e5e" stroke-width="1.6"/>
<text x="480" y="158" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#7a6e5e" text-anchor="middle">17.4</text>
<rect x="180" y="200" width="180" height="70" rx="8" fill="#7a6e5e" opacity="0.10" stroke="#7a6e5e" stroke-width="1.6"/>
<text x="270" y="243" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#7a6e5e" text-anchor="middle">18.2</text>
<rect x="390" y="200" width="180" height="70" rx="8" fill="#4f6d55" opacity="0.18" stroke="#4f6d55" stroke-width="2"/>
<text x="480" y="243" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#4f6d55" text-anchor="middle">20.1</text>
<text x="380" y="310" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">greedy: rest when tired, study when fresh.</text>
</svg>
