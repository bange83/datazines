<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="three hugs: R-squared 0.2, 0.6, 1">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="360" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="360" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>

<!-- panel 1: loose -->
<text x="130" y="36" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">R² ≈ 0.2</text>
<path d="M 40,260 L 40,55" fill="none" stroke="#241c14" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 40,260 L 220,260" fill="none" stroke="#241c14" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 55,230 L 205,90" fill="none" stroke="#b44a28" stroke-width="2.2" stroke-linecap="round"/>
<ellipse cx="70" cy="175" rx="5.8" ry="6.2" fill="#241c14" opacity="0.9"/>
<ellipse cx="95" cy="210" rx="6.1" ry="5.7" fill="#241c14" opacity="0.9"/>
<ellipse cx="120" cy="120" rx="5.9" ry="6.3" fill="#241c14" opacity="0.9"/>
<ellipse cx="150" cy="195" rx="6.0" ry="5.8" fill="#241c14" opacity="0.9"/>
<ellipse cx="180" cy="95" rx="6.2" ry="6.0" fill="#241c14" opacity="0.9"/>
<text x="130" y="290" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#7a6e5e" text-anchor="middle">loose hug</text>

<!-- panel 2: medium -->
<text x="380" y="36" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">R² ≈ 0.6</text>
<path d="M 290,260 L 290,55" fill="none" stroke="#241c14" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 290,260 L 470,260" fill="none" stroke="#241c14" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 305,230 L 455,90" fill="none" stroke="#b44a28" stroke-width="2.2" stroke-linecap="round"/>
<ellipse cx="325" cy="200" rx="5.8" ry="6.1" fill="#241c14" opacity="0.9"/>
<ellipse cx="355" cy="185" rx="6.0" ry="5.8" fill="#241c14" opacity="0.9"/>
<ellipse cx="385" cy="155" rx="5.9" ry="6.2" fill="#241c14" opacity="0.9"/>
<ellipse cx="415" cy="145" rx="6.1" ry="5.7" fill="#241c14" opacity="0.9"/>
<ellipse cx="445" cy="108" rx="6.0" ry="6.0" fill="#241c14" opacity="0.9"/>
<text x="380" y="290" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#7a6e5e" text-anchor="middle">most of the scatter gone</text>

<!-- panel 3: on the line -->
<text x="630" y="36" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">R² = 1</text>
<path d="M 540,260 L 540,55" fill="none" stroke="#241c14" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 540,260 L 720,260" fill="none" stroke="#241c14" stroke-width="1.6" stroke-linecap="round"/>
<path d="M 555,230 L 705,90" fill="none" stroke="#b44a28" stroke-width="2.2" stroke-linecap="round"/>
<ellipse cx="575" cy="211" rx="5.8" ry="6.0" fill="#241c14" opacity="0.9"/>
<ellipse cx="610" cy="178" rx="6.0" ry="5.8" fill="#241c14" opacity="0.9"/>
<ellipse cx="645" cy="146" rx="5.9" ry="6.1" fill="#241c14" opacity="0.9"/>
<ellipse cx="680" cy="113" rx="6.0" ry="5.9" fill="#241c14" opacity="0.9"/>
<text x="630" y="290" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#7a6e5e" text-anchor="middle">a fairy tale</text>

<text x="380" y="332" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">same kind of cloud. tighter hug = more scatter explained. not a medal.</text>
</svg>
