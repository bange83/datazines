<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="The imbalance trap: True Negatives swallow FPR">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="38" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">the imbalance trap: a mountain of true negatives hides the stink.</text>

<!-- Left box: FPR calculation -->
<rect x="70" y="90" width="290" height="250" rx="8" ry="8" fill="#f4efe4" stroke="#3d5f86" stroke-width="2"/>
<text x="215" y="125" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#3d5f86" text-anchor="middle">In ROC: False Positive Rate</text>
<text x="215" y="170" font-family="Georgia" font-size="15" fill="#241c14" text-anchor="middle">FPR = FP / (FP + TN)</text>
<text x="215" y="210" font-family="Georgia" font-size="14" fill="#241c14" text-anchor="middle">FP = 30,  TN = 920</text>
<text x="215" y="240" font-family="Georgia" font-size="16" fill="#4f6d55" text-anchor="middle">FPR = 30 / 950 = 3.1% !</text>
<text x="215" y="280" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#7a6e5e" text-anchor="middle">The huge mountain of 920 TN</text>
<text x="215" y="300" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#7a6e5e" text-anchor="middle">makes the error look tiny!</text>

<!-- Right box: Precision calculation -->
<rect x="400" y="90" width="290" height="250" rx="8" ry="8" fill="#f4efe4" stroke="#b44a28" stroke-width="2"/>
<text x="545" y="125" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="middle">In PR: Precision</text>
<text x="545" y="170" font-family="Georgia" font-size="15" fill="#241c14" text-anchor="middle">Precision = TP / (TP + FP)</text>
<text x="545" y="210" font-family="Georgia" font-size="14" fill="#241c14" text-anchor="middle">TP = 20,  FP = 30</text>
<text x="545" y="240" font-family="Georgia" font-size="16" fill="#b44a28" text-anchor="middle">Precision = 20 / 50 = 40%</text>
<text x="545" y="280" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#7a6e5e" text-anchor="middle">No TN anywhere in sight.</text>
<text x="545" y="300" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#b44a28" text-anchor="middle">60% of positive alerts are junk!</text>
</svg>