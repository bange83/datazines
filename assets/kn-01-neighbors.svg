<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Choice of k: 1 memorizes noise, 15 smooths">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="38" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">the choice of k: 1 memorizes every lonely outlier; large k is a calm majority.</text>

<!-- Left: k=1 -->
<g transform="translate(70, 70)">
  <rect width="270" height="260" fill="#f4efe4" stroke="#b44a28" stroke-width="2" rx="8" ry="8"/>
  <text x="135" y="30" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#b44a28" text-anchor="middle">k = 1 (extreme variance)</text>
  
  <!-- Jagged boundary with islands -->
  <path d="M 0,160 Q 60,180 90,140 T 150,110 T 220,130 L 270,80" fill="none" stroke="#241c14" stroke-width="2"/>
  <!-- Outlier island -->
  <circle cx="60" cy="80" r="25" fill="#3d5f86" opacity="0.2" stroke="#3d5f86" stroke-width="1.5"/>
  <circle cx="60" cy="80" r="6" fill="#3d5f86"/>
  <text x="60" y="120" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="12" fill="#3d5f86" text-anchor="middle">noise island</text>
  
  <text x="135" y="220" font-family="Georgia" font-size="13" fill="#241c14" text-anchor="middle">Train accuracy: 100%</text>
  <text x="135" y="245" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#b44a28" text-anchor="middle">overfits every stray pebble!</text>
</g>

<!-- Right: k=15 -->
<g transform="translate(420, 70)">
  <rect width="270" height="260" fill="#f4efe4" stroke="#4f6d55" stroke-width="2" rx="8" ry="8"/>
  <text x="135" y="30" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#4f6d55" text-anchor="middle">k = 15 (calm consensus)</text>
  
  <!-- Smooth gentle boundary -->
  <path d="M 0,180 Q 130,150 270,100" fill="none" stroke="#241c14" stroke-width="2.2"/>
  
  <circle cx="60" cy="80" r="6" fill="#3d5f86"/>
  <text x="60" y="105" font-family="Georgia" font-size="12" fill="#7a6e5e" text-anchor="middle">outlier outvoted</text>
  
  <text x="135" y="220" font-family="Georgia" font-size="13" fill="#241c14" text-anchor="middle">Smooth, stable boundary</text>
  <text x="135" y="245" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#4f6d55" text-anchor="middle">generalizes to new students</text>
</g>
</svg>