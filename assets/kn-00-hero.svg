<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="k-Nearest Neighbors: look around, take a vote">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="38" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">no formulas, no lines. find the k closest students and count the vote.</text>

<!-- Axes -->
<path d="M 80,350 L 690,350" fill="none" stroke="#241c14" stroke-width="1.8"/>
<path d="M 90,360 L 90,70" fill="none" stroke="#241c14" stroke-width="1.8"/>
<text x="700" y="355" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#241c14">hours</text>
<text x="80" y="65" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#241c14" text-anchor="end">sleep</text>

<!-- Known points: Failers (blue circles) -->
<circle cx="160" cy="280" r="7" fill="#3d5f86" opacity="0.8"/>
<circle cx="210" cy="310" r="7" fill="#3d5f86" opacity="0.8"/>
<circle cx="250" cy="270" r="7" fill="#3d5f86" opacity="0.8"/>
<circle cx="190" cy="220" r="7" fill="#3d5f86" opacity="0.8"/>
<circle cx="310" cy="290" r="7" fill="#3d5f86" opacity="0.8"/>
<circle cx="280" cy="220" r="7" fill="#3d5f86" opacity="0.8"/>

<!-- Known points: Passers (rust circles) -->
<circle cx="480" cy="140" r="7" fill="#b44a28" opacity="0.8"/>
<circle cx="530" cy="180" r="7" fill="#b44a28" opacity="0.8"/>
<circle cx="580" cy="120" r="7" fill="#b44a28" opacity="0.8"/>
<circle cx="450" cy="190" r="7" fill="#b44a28" opacity="0.8"/>
<circle cx="520" cy="230" r="7" fill="#b44a28" opacity="0.8"/>

<!-- Query point (new student at x=360, y=210) -->
<!-- Neighborhood circle (k=5) -->
<circle cx="370" cy="210" r="85" fill="#c4a35a" opacity="0.18" stroke="#7a6e5e" stroke-width="1.5" stroke-dasharray="4,4"/>
<polygon points="370,198 375,208 385,210 377,218 380,228 370,222 360,228 363,218 355,210 365,208" fill="#241c14"/>
<text x="370" y="190" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#241c14" text-anchor="middle">new student (?)</text>

<!-- The 5 neighbors inside circle -->
<circle cx="340" cy="245" r="7" fill="#3d5f86"/>
<circle cx="330" cy="180" r="7" fill="#3d5f86"/>
<circle cx="410" cy="170" r="7" fill="#b44a28"/>
<circle cx="420" cy="240" r="7" fill="#b44a28"/>
<circle cx="440" cy="205" r="7" fill="#b44a28"/>

<!-- Voting outcome bracket -->
<g transform="translate(560, 260)">
  <rect width="160" height="90" rx="8" ry="8" fill="#f4efe4" stroke="#4f6d55" stroke-width="1.8"/>
  <text x="80" y="25" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#4f6d55" text-anchor="middle">k = 5 vote</text>
  <text x="80" y="50" font-family="Georgia" font-size="13" fill="#241c14" text-anchor="middle">3 pass  vs  2 fail</text>
  <text x="80" y="75" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="middle">Prediction: PASS</text>
</g>
</svg>