<path d="M 250,170 L 290,170" fill="none" stroke="#b44a28" stroke-width="2.4" stroke-linecap="round" opacity="1"/>
<path d="M 280,164 L 292,170 L 280,176" fill="none" stroke="#b44a28" stroke-width="2.2" stroke-linecap="round"/>
<path d="M 470,170 L 510,170" fill="none" stroke="#b44a28" stroke-width="2.4" stroke-linecap="round" opacity="1"/>
<path d="M 500,164 L 512,170 L 500,176" fill="none" stroke="#b44a28" stroke-width="2.2" stroke-linecap="round"/>
<text x="380" y="120" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="middle">forward  (guess)</text>
<path d="M 510,230 L 470,230" fill="none" stroke="#3d5f86" stroke-width="2.4" stroke-linecap="round" opacity="1"/>
<path d="M 482,224 L 470,230 L 482,236" fill="none" stroke="#3d5f86" stroke-width="2.2" stroke-linecap="round"/>
<path d="M 290,230 L 250,230" fill="none" stroke="#3d5f86" stroke-width="2.4" stroke-linecap="round" opacity="1"/>
<path d="M 262,224 L 250,230 L 262,236" fill="none" stroke="#3d5f86" stroke-width="2.2" stroke-linecap="round"/>
<text x="380" y="268" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#3d5f86" text-anchor="middle">leftover walks home  (backprop)</text>
<text x="380" y="330" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">then descent nudges every knob a quiet step.</text>
</svg>
