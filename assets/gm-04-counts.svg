<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="Poisson mean stays positive while an ordinary line predicts negative mistakes">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="860" height="430" rx="18" fill="#f4efe4"/>
  <rect width="860" height="430" rx="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>

  <text x="430" y="38" font-family="Bradley Hand, Apple Chancery, Comic Sans MS, cursive" font-size="21" fill="#7a6e5e" text-anchor="middle">same students. two ways to draw the mean.</text>

  <path d="M85 55 L85 360 L805 360" fill="none" stroke="#241c14" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M85 295 L805 295" fill="none" stroke="#7a6e5e" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.75"/>
  <text x="70" y="301" font-family="Georgia, serif" font-size="14" fill="#7a6e5e" text-anchor="end">0</text>
  <text x="70" y="236" font-family="Georgia, serif" font-size="14" fill="#7a6e5e" text-anchor="end">2</text>
  <text x="70" y="171" font-family="Georgia, serif" font-size="14" fill="#7a6e5e" text-anchor="end">4</text>
  <text x="70" y="106" font-family="Georgia, serif" font-size="14" fill="#7a6e5e" text-anchor="end">6</text>
  <text x="86" y="382" font-family="Georgia, serif" font-size="14" fill="#7a6e5e" text-anchor="middle">0</text>
  <text x="158" y="382" font-family="Georgia, serif" font-size="14" fill="#7a6e5e" text-anchor="middle">1</text>
  <text x="518" y="382" font-family="Georgia, serif" font-size="14" fill="#7a6e5e" text-anchor="middle">6</text>
  <text x="806" y="382" font-family="Georgia, serif" font-size="14" fill="#7a6e5e" text-anchor="middle">10</text>
  <text x="445" y="412" font-family="Bradley Hand, Apple Chancery, Comic Sans MS, cursive" font-size="18" fill="#241c14" text-anchor="middle">hours studied</text>
  <text x="25" y="210" font-family="Bradley Hand, Apple Chancery, Comic Sans MS, cursive" font-size="18" fill="#241c14" text-anchor="middle" transform="rotate(-90 25 210)">mean mistakes</text>

  <path d="M86 52 L158 108 L230 152 L302 185 L374 211 L446 230 L518 245 L590 257 L662 265 L734 272 L806 278" fill="none" stroke="#4f6d55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 99 L158 126 L230 152 L302 178 L374 204 L446 231 L518 257 L590 284 L662 310 L734 336 L806 363" fill="none" stroke="#b44a28" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="158" cy="108" r="5" fill="#4f6d55"/>
  <circle cx="518" cy="245" r="5" fill="#4f6d55"/>
  <circle cx="806" cy="277" r="5" fill="#4f6d55"/>
  <text x="171" y="98" font-family="Georgia, serif" font-size="14" fill="#4f6d55">5.74</text>
  <text x="530" y="235" font-family="Georgia, serif" font-size="14" fill="#4f6d55">1.53</text>
  <text x="790" y="267" font-family="Georgia, serif" font-size="14" fill="#4f6d55" text-anchor="end">0.53</text>

  <text x="595" y="225" font-family="Bradley Hand, Apple Chancery, Comic Sans MS, cursive" font-size="18" fill="#4f6d55">Poisson: bends toward 0</text>
  <text x="593" y="336" font-family="Bradley Hand, Apple Chancery, Comic Sans MS, cursive" font-size="18" fill="#b44a28">ordinary line: −2.08</text>
  <path d="M778 342 Q792 349 803 359" fill="none" stroke="#b44a28" stroke-width="2" stroke-linecap="round"/>
  <text x="430" y="68" font-family="Georgia, serif" font-size="14" fill="#7a6e5e" text-anchor="middle">the curve is the fitted mean in mistake-land</text>
</svg>
