<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="more than one x: scale so knobs speak one language">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="400" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="400" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="40" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="middle">same people. three spellings.</text>
<rect x="40" y="70" width="200" height="220" rx="12" fill="#b44a28" opacity="0.08" stroke="#b44a28" stroke-width="2"/>
<text x="140" y="130" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#b44a28" text-anchor="middle">hours</text>
<text x="140" y="175" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#241c14" text-anchor="middle">1 – 6</text>
<text x="140" y="230" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">one typical step</text>
<text x="140" y="255" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">≈ 1 hour</text>
<rect x="280" y="70" width="200" height="220" rx="12" fill="#3d5f86" opacity="0.08" stroke="#3d5f86" stroke-width="2"/>
<text x="380" y="130" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#3d5f86" text-anchor="middle">minutes</text>
<text x="380" y="175" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#241c14" text-anchor="middle">60 – 360</text>
<text x="380" y="230" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">same fact.</text>
<text x="380" y="255" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">huge numbers.</text>
<rect x="520" y="70" width="200" height="220" rx="12" fill="#4f6d55" opacity="0.08" stroke="#4f6d55" stroke-width="2"/>
<text x="620" y="130" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#4f6d55" text-anchor="middle">sleep</text>
<text x="620" y="175" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#241c14" text-anchor="middle">4 – 9</text>
<text x="620" y="230" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">a different</text>
<text x="620" y="255" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">lever. own unit.</text>
<text x="380" y="340" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#241c14" text-anchor="middle">one x: skip.  more than one: scale.</text>
<text x="380" y="370" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">then +1 on a knob is one typical step — not one minute vs one hour.</text>
</svg>
