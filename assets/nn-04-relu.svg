<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="ReLU: negative scores become zero">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="380" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="380" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<path d="M 80,300 L 680,300" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" opacity="1"/>
<path d="M 320,50 L 320,350" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" opacity="1"/>
<path d="M 669,294 L 680,300 L 669,306" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<path d="M 314,61 L 320,50 L 326,61" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<text x="688" y="306" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="start">in</text>
<text x="328" y="46" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="start">out</text>
<path d="M 120,300 L 320,300" fill="none" stroke="#b44a28" stroke-width="3.0" stroke-linecap="round" opacity="1"/>
<path d="M 320,300 L 620,90" fill="none" stroke="#b44a28" stroke-width="3.0" stroke-linecap="round" opacity="1"/>
<text x="150" y="280" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="start">dies</text>
<text x="500" y="140" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="start">passes</text>
<text x="380" y="360" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">negative in → 0. positive in → the same number. ReLU.</text>
</svg>
