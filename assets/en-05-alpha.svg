<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="alpha mixes ridge and lasso">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="300" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="300" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380.0" y="48.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#7a6e5e" text-anchor="middle" font-style="normal" font-weight="normal">α  is the mix  (not λ — λ is still the volume)</text>
<path d="M 80.00,150.00 L 180.00,149.99 Q 180.00,149.99 230.00,149.96 Q 280.00,149.93 330.00,149.94 Q 380.00,149.95 430.00,149.93 Q 480.00,149.92 530.00,150.00 Q 580.00,150.08 630.00,150.04 L 680.00,150.00" fill="none" stroke="#241c14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="80.0" y="190.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#3d5f86" text-anchor="start" font-style="normal" font-weight="normal">α = 0</text>
<text x="80.0" y="214.0" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#7a6e5e" text-anchor="start" font-style="normal" font-weight="normal">pure ridge</text>
<text x="680.0" y="190.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="end" font-style="normal" font-weight="normal">α = 1</text>
<text x="680.0" y="214.0" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#7a6e5e" text-anchor="end" font-style="normal" font-weight="normal">pure lasso</text>
<ellipse cx="380.0" cy="150.0" rx="12.4" ry="10.6" transform="rotate(-9.9 380.0 150.0)" fill="#c4a35a" opacity="0.92"/>
<ellipse cx="381.2" cy="148.9" rx="3.5" ry="2.3" fill="#f7f2ea" opacity="0.35"/>
<text x="380.0" y="122.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#c4a35a" text-anchor="middle" font-style="normal" font-weight="normal">elastic net</text>
<text x="380.0" y="250.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle" font-style="normal" font-weight="normal">λ still says how loud. α says which tax you lean toward.</text>
</svg>
