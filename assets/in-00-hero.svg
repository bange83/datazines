<rect x="330" y="80" width="110" height="200" rx="8" fill="#4f6d55" opacity="0.12" stroke="#4f6d55" stroke-width="2"/>
<text x="385" y="185" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#4f6d55" text-anchor="middle">nets</text>
<rect x="460" y="80" width="110" height="200" rx="8" fill="#c4a35a" opacity="0.12" stroke="#c4a35a" stroke-width="2"/>
<text x="515" y="185" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#c4a35a" text-anchor="middle">bayes</text>
<rect x="590" y="80" width="110" height="200" rx="8" fill="#7a6e5e" opacity="0.12" stroke="#7a6e5e" stroke-width="2"/>
