<path d="M 50,290 L 710,290" fill="none" stroke="#241c14" stroke-width="2.2"/>
<text x="380" y="340" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">same paper in every folder.</text>
