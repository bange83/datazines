<ellipse cx="340.0" cy="230.0" rx="7.8" ry="8.8" transform="rotate(1.3 340.0 230.0)" fill="#3d5f86" opacity="0.9"/>
<ellipse cx="420.0" cy="230.0" rx="8.1" ry="7.5" transform="rotate(-23.8 420.0 230.0)" fill="#3d5f86" opacity="0.9"/>
<ellipse cx="500.0" cy="230.0" rx="15.3" ry="14.6" transform="rotate(0.5 500.0 230.0)" fill="#b44a28" opacity="0.9"/>
