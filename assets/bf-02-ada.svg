<ellipse cx="420.0" cy="120.0" rx="9.2" ry="9.2" transform="rotate(-17.1 420.0 120.0)" fill="#3d5f86" opacity="0.9"/>
<ellipse cx="500.0" cy="120.0" rx="8.9" ry="8.8" transform="rotate(11.2 500.0 120.0)" fill="#b44a28" opacity="0.9"/>
<ellipse cx="580.0" cy="120.0" rx="10.1" ry="10.0" transform="rotate(2.2 580.0 120.0)" fill="#3d5f86" opacity="0.9"/>
<text x="680.0" y="126.0" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#7a6e5e" text-anchor="end">equal weight</text>
<text x="80.0" y="200.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="start">round 2</text>
<ellipse cx="180.0" cy="230.0" rx="7.9" ry="7.6" transform="rotate(-23.2 180.0 230.0)" fill="#3d5f86" opacity="0.9"/>
