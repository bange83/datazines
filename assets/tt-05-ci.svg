<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="the interval of boring stories that still fit">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="360" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="360" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380.0" y="40.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#7a6e5e" text-anchor="middle">slope b = 1.00.  leftover rattles it by 0.11.</text>
<path d="M 80.0,180.0 L 680.0,180.0" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" opacity="1"/>
<path d="M 150.6,170.0 L 150.6,190.0" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round" opacity="1"/>
