<path d="M 411.8,180.0 L 595.3,180.0" fill="none" stroke="#b44a28" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
<path d="M 411.8,168.0 L 411.8,192.0" fill="none" stroke="#b44a28" stroke-width="2.2" stroke-linecap="round" opacity="1"/>
<path d="M 595.3,168.0 L 595.3,192.0" fill="none" stroke="#b44a28" stroke-width="2.2" stroke-linecap="round" opacity="1"/>
<ellipse cx="503.5" cy="180.0" rx="8" ry="8" transform="rotate(0 503.5 180.0)" fill="#b44a28" opacity="1"/>
<text x="503.5" y="150.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="middle">1.00</text>
<text x="411.8" y="250.0" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#b44a28" text-anchor="middle">0.74</text>
<text x="595.3" y="250.0" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#b44a28" text-anchor="middle">1.26</text>
<text x="380.0" y="300.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle">0 is not in the interval. the boring story (b = 0) does not fit.</text>
<text x="380.0" y="332.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">mean’s interval 3.72–6.78 still covers 5. quiet.</text>
