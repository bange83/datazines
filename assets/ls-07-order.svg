<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="order of entry in LARS">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="360" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="360" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380.0" y="42.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="middle" font-style="normal" font-weight="normal">who enters first  =  who currently matches the leftover</text>
<ellipse cx="120" cy="175" rx="58" ry="58" fill="none" stroke="#4f6d55" stroke-width="2.2"/>
<text x="120.0" y="168.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="28" fill="#4f6d55" text-anchor="middle" font-style="normal" font-weight="normal">1</text>
<text x="120.0" y="258.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#241c14" text-anchor="middle" font-style="normal" font-weight="normal">hours</text>
<text x="120.0" y="288.0" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#7a6e5e" text-anchor="middle" font-style="normal" font-weight="normal">closest to leftover</text>
<ellipse cx="380" cy="175" rx="58" ry="58" fill="none" stroke="#4f6d55" stroke-width="2.2"/>
<text x="380.0" y="168.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="28" fill="#4f6d55" text-anchor="middle" font-style="normal" font-weight="normal">2</text>
<text x="380.0" y="258.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#241c14" text-anchor="middle" font-style="normal" font-weight="normal">sleep</text>
<text x="380.0" y="288.0" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#7a6e5e" text-anchor="middle" font-style="normal" font-weight="normal">ties, then joins</text>
<ellipse cx="640" cy="175" rx="58" ry="58" fill="none" stroke="#4f6d55" stroke-width="2.2"/>
<text x="640.0" y="168.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="28" fill="#4f6d55" text-anchor="middle" font-style="normal" font-weight="normal">3</text>
<text x="640.0" y="258.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#241c14" text-anchor="middle" font-style="normal" font-weight="normal">tutor</text>
<text x="640.0" y="288.0" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#7a6e5e" text-anchor="middle" font-style="normal" font-weight="normal">later, weaker</text>
</svg>
