<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="error on new data vs lambda is a U">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<path d="M 80,360 L 80,50" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<path d="M 74,66 L 80,50 L 86,66" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<path d="M 80,360 L 680,360" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<path d="M 664,354 L 680,360 L 664,366" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<text x="72" y="42" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#241c14" text-anchor="end">error on new data</text>
<text x="690" y="366" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#241c14">λ</text>
<!-- U: high, down, high. sweet in the valley (large y = near axis = low error) -->
<path d="M 120,110 L 180,150 L 240,200 L 300,250 L 360,275 L 420,275 L 480,250 L 540,200 L 600,150 L 650,115" fill="none" stroke="#3d5f86" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<ellipse cx="390" cy="275" rx="8" ry="7.4" transform="rotate(12 390 275)" fill="#b44a28" opacity="0.92"/>
<text x="390" y="308" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#b44a28" text-anchor="middle">sweet spot</text>
<text x="155" y="98" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e">too wild</text>
<text x="620" y="98" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="end">too shy</text>
<text x="380" y="396" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">hide people. pick the λ at the bottom of the U.</text>
</svg>
