<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="The peeking trap: p-value wandering across the threshold">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="38" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">the peeking trap: look every day, stop at first dip = fake victory.</text>

<!-- Axes -->
<path d="M 80,340 L 700,340" fill="none" stroke="#241c14" stroke-width="1.8"/>
<path d="M 90,350 L 90,70" fill="none" stroke="#241c14" stroke-width="1.8"/>
<text x="700" y="365" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#241c14">days / sample size (N)</text>
<text x="78" y="75" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#241c14" text-anchor="end">p-value</text>

<!-- Y tick marks -->
<text x="75" y="105" font-family="Georgia" font-size="13" fill="#7a6e5e" text-anchor="end">0.50</text>
<text x="75" y="275" font-family="Georgia" font-size="13" fill="#b44a28" text-anchor="end">0.05</text>
<text x="75" y="345" font-family="Georgia" font-size="13" fill="#7a6e5e" text-anchor="end">0.00</text>

<!-- Red dashed threshold at p = 0.05 -->
<path d="M 90,270 L 690,270" fill="none" stroke="#b44a28" stroke-width="1.8" stroke-dasharray="6,4"/>
<text x="695" y="265" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#b44a28">p = 0.05 cut</text>

<!-- Wandering path (A/A test with zero true effect) -->
<path d="M 100,120 L 150,180 L 210,140 L 270,220 L 320,290 L 370,285 L 430,240 L 490,170 L 560,190 L 640,210" fill="none" stroke="#3d5f86" stroke-width="2.2"/>

<!-- Point of premature peeking -->
<ellipse cx="320" cy="290" rx="7" ry="7" fill="#b44a28"/>
<path d="M 320,290 L 360,325 L 430,325" fill="none" stroke="#b44a28" stroke-width="1.5"/>
<text x="435" y="330" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#b44a28">"It worked! Stop the test!"</text>
<text x="435" y="350" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="13" fill="#7a6e5e">(false alarm: pure noise dip)</text>

<!-- End of planned horizon -->
<path d="M 640,345 L 640,85" fill="none" stroke="#241c14" stroke-width="1.5" stroke-dasharray="3,3"/>
<text x="640" y="80" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#241c14" text-anchor="middle">planned N (day 14)</text>
<text x="640" y="200" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#3d5f86" text-anchor="middle">p = 0.22 (honest)</text>
</svg>