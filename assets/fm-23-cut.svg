<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="the 0.5 cut is politics">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="340" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="340" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="36" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">same S. three cuts. three personalities.</text>
<rect x="50" y="70" width="660" height="70" rx="8" fill="#4f6d55" opacity="0.10" stroke="#4f6d55" stroke-width="1.8"/>
<text x="90" y="114" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#4f6d55" text-anchor="start">cut 0.3</text>
<text x="250" y="114" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#241c14" text-anchor="start">acc 0.83   prec 0.82   rec 0.82</text>
<text x="620" y="114" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="end">find more passers</text>
<rect x="50" y="155" width="660" height="70" rx="8" fill="#3d5f86" opacity="0.10" stroke="#3d5f86" stroke-width="1.8"/>
<text x="90" y="199" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#3d5f86" text-anchor="start">cut 0.5</text>
<text x="250" y="199" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#241c14" text-anchor="start">acc 0.75   prec 1.00   rec 0.45</text>
<text x="620" y="199" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="end">no false alarms</text>
<rect x="50" y="240" width="660" height="70" rx="8" fill="#7a6e5e" opacity="0.10" stroke="#7a6e5e" stroke-width="1.8"/>
<text x="90" y="284" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="start">cut 0.7</text>
<text x="250" y="284" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#241c14" text-anchor="start">acc 0.54   prec 0.00   rec 0.00</text>
<text x="620" y="284" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="end">never says yes</text>
</svg>
