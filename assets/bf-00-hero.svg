<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="three boosting dialects">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="860" height="380" rx="18" ry="18" fill="#f4efe4"/>
<rect width="860" height="380" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="430.0" y="42.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="24" fill="#241c14" text-anchor="middle">one chain. three dialects.</text>
<path d="M 70.0,90 L 270.0,90 L 270.0,280 L 70.0,280 Z" fill="#b44a28" stroke="#b44a28" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" opacity="0.1"/>
<text x="170.0" y="155.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#b44a28" text-anchor="middle">AdaBoost</text>
<text x="170.0" y="210.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle">reweight people</text>
<path d="M 330.0,90 L 530.0,90 L 530.0,280 L 330.0,280 Z" fill="#c4a35a" stroke="#c4a35a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" opacity="0.1"/>
<text x="430.0" y="155.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#c4a35a" text-anchor="middle">gradient</text>
<text x="430.0" y="210.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle">fit leftovers</text>
<path d="M 590.0,90 L 790.0,90 L 790.0,280 L 590.0,280 Z" fill="#3d5f86" stroke="#3d5f86" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" opacity="0.1"/>
<text x="690.0" y="155.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#3d5f86" text-anchor="middle">XGBoost & co.</text>
<text x="690.0" y="210.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle">same, plus taxes</text>
<text x="430.0" y="340.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">not three religions. one idea with different manners.</text>
</svg>
