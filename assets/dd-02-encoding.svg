<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Categorical encoding and target leakage">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="38" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">words to numbers: one-hot for small lists, target encoding inside folds.</text>

<!-- Left: One-Hot -->
<rect x="60" y="80" width="290" height="280" rx="8" ry="8" fill="#f4efe4" stroke="#3d5f86" stroke-width="2"/>
<text x="205" y="115" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#3d5f86" text-anchor="middle">One-Hot Encoding</text>
<text x="205" y="145" font-family="Georgia" font-size="13" fill="#241c14" text-anchor="middle">dorm ∈ {North, South, East}</text>
<text x="80" y="190" font-family="Georgia" font-size="13" fill="#241c14">North → [0, 0] (reference)</text>
<text x="80" y="220" font-family="Georgia" font-size="13" fill="#241c14">South → [1, 0]</text>
<text x="80" y="250" font-family="Georgia" font-size="13" fill="#241c14">East  → [0, 1]</text>
<text x="205" y="310" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#4f6d55" text-anchor="middle">Clean, honest, zero leakage.</text>
<text x="205" y="330" font-family="Georgia" font-size="12" fill="#7a6e5e" text-anchor="middle">Explodes if 10,000 ZIP codes!</text>

<!-- Right: Target Encoding & Leakage warning -->
<rect x="410" y="80" width="290" height="280" rx="8" ry="8" fill="#f4efe4" stroke="#b44a28" stroke-width="2"/>
<text x="555" y="115" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="middle">Target Encoding & Leakage</text>
<text x="555" y="145" font-family="Georgia" font-size="13" fill="#241c14" text-anchor="middle">Replace "South" with mean(grade)</text>
<rect x="430" y="170" width="250" height="110" rx="6" ry="6" fill="#b44a28" opacity="0.15"/>
<text x="555" y="195" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#b44a28" text-anchor="middle">The Target Leakage Crime:</text>
<text x="445" y="225" font-family="Georgia" font-size="12" fill="#241c14">Computing target mean on ALL rows</text>
<text x="445" y="245" font-family="Georgia" font-size="12" fill="#241c14">before train/test split leaks y into X!</text>
<text x="445" y="265" font-family="Georgia" font-size="12" fill="#b44a28" font-weight="bold">Result: 0.99 train score, fails in prod.</text>
<text x="555" y="325" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#4f6d55" text-anchor="middle">Rule: fit encoder ONLY on train!</text>
</svg>