<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="after scale: PC1 is the twins">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="360" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="360" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="36" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">scaled. PC1 = hours and minutes together.</text>
<ellipse cx="200" cy="210" rx="5" ry="5" fill="#241c14"/>
<path d="M 200,210 L 340,120" fill="none" stroke="#b44a28" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 322,132 L 342,120 L 324,112" fill="none" stroke="#b44a28" stroke-width="2.2" stroke-linecap="round"/>
<text x="350" y="114" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="start">PC1  twins</text>
<path d="M 200,210 L 240,280" fill="none" stroke="#c4a35a" stroke-width="2" stroke-linecap="round"/>
<text x="248" y="294" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#c4a35a" text-anchor="start">PC4  the fight  0.1%</text>
<text x="500" y="120" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="start">PC1  hours  0.70</text>
<text x="500" y="148" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="start">      minutes 0.70</text>
<text x="500" y="190" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#c4a35a" text-anchor="start">PC4  hours −0.71</text>
<text x="500" y="218" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#c4a35a" text-anchor="start">      minutes 0.71</text>
<text x="500" y="260" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#7a6e5e" text-anchor="start">same fact, two spellings.</text>
<text x="500" y="284" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#7a6e5e" text-anchor="start">the fight is almost nothing.</text>
</svg>
