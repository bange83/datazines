<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="how much scatter each PC keeps">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="340" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="340" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="36" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">keep the fat axes. drop the 0.1%.</text>
<path d="M 110,145.8 L 200,145.8 L 200,270 L 110,270 Z" fill="#b44a28" stroke="#b44a28" stroke-width="1.6" opacity="0.3"/>
<text x="155" y="294" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="middle">PC1</text>
<text x="155" y="137.8" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#b44a28" text-anchor="middle">50%</text>
<path d="M 260,194.0 L 350,194.0 L 350,270 L 260,270 Z" fill="#3d5f86" stroke="#3d5f86" stroke-width="1.6" opacity="0.3"/>
<text x="305" y="294" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#3d5f86" text-anchor="middle">PC2</text>
<text x="305" y="186.0" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#3d5f86" text-anchor="middle">26%</text>
<path d="M 410,198.4 L 500,198.4 L 500,270 L 410,270 Z" fill="#4f6d55" stroke="#4f6d55" stroke-width="1.6" opacity="0.3"/>
<text x="455" y="294" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#4f6d55" text-anchor="middle">PC3</text>
<text x="455" y="190.4" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#4f6d55" text-anchor="middle">24%</text>
<path d="M 560,245.8 L 650,245.8 L 650,270 L 560,270 Z" fill="#7a6e5e" stroke="#7a6e5e" stroke-width="1.6" opacity="0.3"/>
<text x="605" y="294" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">PC4</text>
<text x="605" y="237.8" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#7a6e5e" text-anchor="middle">0.1%</text>
<text x="380" y="324" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#7a6e5e" text-anchor="middle">1 PC ≈ half. 2 PCs ≈ 76%. 3 PCs ≈ all. 4th is the twin-fight.</text>
</svg>
