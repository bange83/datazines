<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="confidence intervals use repeated sampling while HDI describes posterior mass">
<defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter></defs>
<rect width="860" height="360" rx="18" ry="18" fill="#f4efe4"/>
<rect width="860" height="360" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="430" y="36" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="middle">both say 95%. they do not say the same thing.</text>
<rect x="55" y="70" width="355" height="220" rx="16" fill="#3d5f86" opacity="0.1" stroke="#3d5f86" stroke-width="2"/>
<rect x="450" y="70" width="355" height="220" rx="16" fill="#4f6d55" opacity="0.1" stroke="#4f6d55" stroke-width="2"/>
<text x="232" y="112" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="23" fill="#3d5f86" text-anchor="middle">95% CI</text>
<text x="627" y="112" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="23" fill="#4f6d55" text-anchor="middle">95% HDI</text>
<text x="232" y="158" font-family="Georgia, serif" font-size="17" fill="#241c14" text-anchor="middle">repeat the recipe</text>
<text x="232" y="188" font-family="Georgia, serif" font-size="17" fill="#241c14" text-anchor="middle">fixed truth</text>
<text x="232" y="218" font-family="Georgia, serif" font-size="17" fill="#241c14" text-anchor="middle">long-run coverage</text>
<text x="627" y="158" font-family="Georgia, serif" font-size="17" fill="#241c14" text-anchor="middle">posterior pile</text>
<text x="627" y="188" font-family="Georgia, serif" font-size="17" fill="#241c14" text-anchor="middle">uncertain parameter</text>
<text x="627" y="218" font-family="Georgia, serif" font-size="17" fill="#241c14" text-anchor="middle">densest 95% mass</text>
<text x="430" y="330" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#7a6e5e" text-anchor="middle">confidence is a method. credible is a posterior.</text>
</svg>
