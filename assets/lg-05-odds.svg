<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="odds climbing with hours">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="360" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="360" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380.0" y="48.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="middle" font-style="normal">b is not “+1 grade”. it is “times the odds”.</text>
<path d="M 140.0,280.0 L 210.0,280.0 L 210.0,236.0 L 140.0,236.0 Z" fill="#4f6d55" stroke="#4f6d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
<path d="M 140.0,236.0 L 210.0,236.0 L 210.0,60.0 L 140.0,60.0 Z" fill="#b44a28" stroke="#b44a28" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
<text x="175.0" y="308.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle" font-style="normal">2 hours</text>
<text x="175.0" y="264.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#4f6d55" text-anchor="middle" font-style="normal">2 pass</text>
<path d="M 360.0,280.0 L 430.0,280.0 L 430.0,170.0 L 360.0,170.0 Z" fill="#4f6d55" stroke="#4f6d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
<path d="M 360.0,170.0 L 430.0,170.0 L 430.0,60.0 L 360.0,60.0 Z" fill="#b44a28" stroke="#b44a28" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
<text x="395.0" y="308.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle" font-style="normal">3 hours</text>
<text x="395.0" y="231.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#4f6d55" text-anchor="middle" font-style="normal">5 pass</text>
<path d="M 580.0,280.0 L 650.0,280.0 L 650.0,104.0 L 580.0,104.0 Z" fill="#4f6d55" stroke="#4f6d55" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
<path d="M 580.0,104.0 L 650.0,104.0 L 650.0,60.0 L 580.0,60.0 Z" fill="#b44a28" stroke="#b44a28" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
<text x="615.0" y="308.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle" font-style="normal">4 hours</text>
<text x="615.0" y="198.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#4f6d55" text-anchor="middle" font-style="normal">8 pass</text>
<text x="380.0" y="340.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#7a6e5e" text-anchor="middle" font-style="normal">odds 2:8 → 5:5 → 8:2.  the S is that climb, squeezed into 0–1.</text>
</svg>
