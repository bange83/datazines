<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="odds 1:1 becomes 3:1; P only goes 50 to 75">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="380" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="380" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>

<text x="380" y="36" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">odds = yeses per no.  P is the slice of the pile.</text>

<!-- left card: 50/50 -->
<text x="175" y="68" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#3d5f86" text-anchor="middle">50 / 50</text>
<!-- 2 pass (rust) 2 fail (ink) as blobs -->
<ellipse cx="140" cy="120" rx="16" ry="15" transform="rotate(-8 140 120)" fill="#b44a28" opacity="0.85"/>
<ellipse cx="210" cy="118" rx="15" ry="16" transform="rotate(11 210 118)" fill="#b44a28" opacity="0.85"/>
<ellipse cx="142" cy="175" rx="15" ry="14" transform="rotate(6 142 175)" fill="#241c14" opacity="0.88"/>
<ellipse cx="208" cy="178" rx="16" ry="15" transform="rotate(-14 208 178)" fill="#241c14" opacity="0.88"/>
<text x="175" y="230" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="middle">2 pass</text>
<text x="175" y="252" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle">2 fail</text>
<text x="175" y="286" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#3d5f86" text-anchor="middle">odds 1 : 1</text>
<text x="175" y="312" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#7a6e5e" text-anchor="middle">P = 0.50</text>

<!-- arrow -->
<path d="M 300,160 L 430,160" fill="none" stroke="#c4a35a" stroke-width="2.6" stroke-linecap="round"/>
<path d="M 414,152 L 432,160 L 414,168" fill="none" stroke="#c4a35a" stroke-width="2.4" stroke-linecap="round"/>
<text x="365" y="140" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#c4a35a" text-anchor="middle">× 3</text>
<text x="365" y="188" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#7a6e5e" text-anchor="middle">on the odds</text>

<!-- right card: 75/25 -->
<text x="585" y="68" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#b44a28" text-anchor="middle">75 / 25</text>
<ellipse cx="530" cy="112" rx="15" ry="15" transform="rotate(8 530 112)" fill="#b44a28" opacity="0.85"/>
<ellipse cx="585" cy="108" rx="16" ry="14" transform="rotate(-10 585 108)" fill="#b44a28" opacity="0.85"/>
<ellipse cx="640" cy="114" rx="15" ry="16" transform="rotate(14 640 114)" fill="#b44a28" opacity="0.85"/>
<ellipse cx="585" cy="178" rx="16" ry="15" transform="rotate(-6 585 178)" fill="#241c14" opacity="0.88"/>
<text x="585" y="230" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="middle">3 pass</text>
<text x="585" y="252" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle">1 fail</text>
<text x="585" y="286" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#b44a28" text-anchor="middle">odds 3 : 1</text>
<text x="585" y="312" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#7a6e5e" text-anchor="middle">P = 0.75</text>

<text x="380" y="354" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">odds ×3.  P only +0.25.  that is why b is not “+ probability”.</text>
</svg>
