<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="860" height="390" role="img" aria-label="ARIMA gives forecast leftovers a fading memory">
<defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter></defs>
<rect width="860" height="390" rx="18" ry="18" fill="#f4efe4"/><rect width="860" height="390" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="430" y="38" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="middle">yesterday’s leftover echoes, then fades.</text>
<path d="M 80,285 L 790,285" stroke="#241c14" stroke-width="1.8"/><path d="M 90,295 L 90,70" stroke="#241c14" stroke-width="1.8"/>
<path d="M 130,145 L 270,185 L 410,214 L 550,238 L 690,252" fill="none" stroke="#b44a28" stroke-width="3" stroke-linecap="round"/>
<circle cx="130" cy="145" r="9" fill="#b44a28"/><circle cx="270" cy="185" r="8" fill="#b44a28"/><circle cx="410" cy="214" r="7" fill="#b44a28"/><circle cx="550" cy="238" r="6" fill="#b44a28"/><circle cx="690" cy="252" r="5" fill="#b44a28"/>
<text x="130" y="115" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="19" fill="#b44a28" text-anchor="middle">1.00</text>
<text x="270" y="160" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="middle">0.45</text>
<text x="410" y="195" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="middle">0.20</text>
<text x="550" y="225" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="middle">0.09</text>
<text x="430" y="335" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#3d5f86" text-anchor="middle">AR = old leftover values. I = difference. MA = old mistakes.</text>
</svg>
