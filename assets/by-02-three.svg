<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="prior, data, posterior">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="300" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="300" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="36" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">three words. that is the whole machine.</text>
<rect x="50" y="70" width="200" height="150" rx="10" fill="#7a6e5e" opacity="0.10" stroke="#7a6e5e" stroke-width="2"/>
<text x="150" y="130" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#7a6e5e" text-anchor="middle">prior</text>
<text x="150" y="170" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">starting bump</text>
<rect x="280" y="70" width="200" height="150" rx="10" fill="#c4a35a" opacity="0.10" stroke="#c4a35a" stroke-width="2"/>
<text x="380" y="130" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#c4a35a" text-anchor="middle">data</text>
<text x="380" y="170" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">3 yes, 5 no</text>
<rect x="510" y="70" width="200" height="150" rx="10" fill="#b44a28" opacity="0.10" stroke="#b44a28" stroke-width="2"/>
<text x="610" y="130" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#b44a28" text-anchor="middle">posterior</text>
<text x="610" y="170" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">the bump after</text>
<text x="380" y="268" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#7a6e5e" text-anchor="middle">people write  posterior  ∝  likelihood  ×  prior.  add the yeses.</text>
</svg>
