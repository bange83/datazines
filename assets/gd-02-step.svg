<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="learning rate volume">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="300" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="300" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380.0" y="42.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#7a6e5e" text-anchor="middle">step size  =  learning rate</text>
<path d="M 80.00,150.00 L 180.00,150.22 Q 180.00,150.22 230.00,149.92 Q 280.00,149.62 330.00,149.60 Q 380.00,149.58 430.00,149.94 Q 480.00,150.29 530.00,150.20 Q 580.00,150.12 630.00,150.06 L 680.00,150.00" fill="none" stroke="#241c14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<ellipse cx="140.0" cy="150.0" rx="9.5" ry="10.3" transform="rotate(5.3 140.0 150.0)" fill="#b44a28" opacity="0.9"/>
<ellipse cx="380.0" cy="150.0" rx="10.2" ry="9.2" transform="rotate(-3.5 380.0 150.0)" fill="#c4a35a" opacity="0.9"/>
<ellipse cx="620.0" cy="150.0" rx="9.7" ry="10.5" transform="rotate(24.7 620.0 150.0)" fill="#4f6d55" opacity="0.9"/>
<text x="140.0" y="190.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="middle">too loud</text>
<text x="140.0" y="212.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#7a6e5e" text-anchor="middle">bounce</text>
<text x="380.0" y="190.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#c4a35a" text-anchor="middle">just right</text>
<text x="380.0" y="212.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#7a6e5e" text-anchor="middle">arrives</text>
<text x="620.0" y="190.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#4f6d55" text-anchor="middle">too shy</text>
<text x="620.0" y="212.0" font-family="Georgia, Times New Roman, serif" font-size="13" fill="#7a6e5e" text-anchor="middle">crawls</text>
</svg>
