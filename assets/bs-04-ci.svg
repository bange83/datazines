<text x="380.0" y="270.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="middle">0 is outside both. hours-do-nothing still does not fit.</text>
<text x="380.0" y="304.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">mean: t 3.72–6.78 · boot 4.12–6.38.  5 sits inside both.</text>
<text x="380.0" y="336.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">the pile did not need a bell. it still agreed.</text>
