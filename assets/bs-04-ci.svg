<ellipse cx="511.2" cy="130.0" rx="6" ry="6" transform="rotate(0 511.2 130.0)" fill="#3d5f86" opacity="1"/>
<text x="120.0" y="124.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#3d5f86" text-anchor="start">t-test  0.74–1.26</text>
