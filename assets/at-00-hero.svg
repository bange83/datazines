<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" role="img" aria-label="coffee looks around: almost all the weight stays on coffee">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="860" height="420" rx="18" ry="18" fill="#f4efe4"/>
<rect width="860" height="420" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="430.0" y="38.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="middle">coffee study hours  —  who does coffee listen to?</text>
<ellipse cx="160.0" cy="200.0" rx="52" ry="34" transform="rotate(5 160.0 200.0)" fill="#efe6d4" stroke="#c4a35a" stroke-width="2.4" opacity="1"/>
<text x="160.0" y="208.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#c4a35a" text-anchor="middle">coffee</text>
<ellipse cx="430.0" cy="200.0" rx="52" ry="34" transform="rotate(5 430.0 200.0)" fill="#efe6d4" stroke="#b44a28" stroke-width="2.4" opacity="1"/>
<text x="430.0" y="208.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#b44a28" text-anchor="middle">study</text>
<ellipse cx="700.0" cy="200.0" rx="52" ry="34" transform="rotate(5 700.0 200.0)" fill="#efe6d4" stroke="#4f6d55" stroke-width="2.4" opacity="1"/>
<text x="700.0" y="208.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#4f6d55" text-anchor="middle">hours</text>
<path d="M 160,164 Q 160,90 210,90 Q 250,90 250,164" fill="none" stroke="#c4a35a" stroke-width="3.2" stroke-linecap="round"/>
<path d="M 242,152 L 250,166 L 258,152" fill="none" stroke="#c4a35a" stroke-width="2.4" stroke-linecap="round"/>
<text x="210.0" y="78.0" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#c4a35a" text-anchor="middle">1.00</text>
<path d="M 214.0,200.0 L 376.0,200.0" fill="none" stroke="#7a6e5e" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>
<path d="M 214.0,214.0 L 646.0,214.0" fill="none" stroke="#7a6e5e" stroke-width="1.2" stroke-linecap="round" opacity="0.25"/>
<text x="300.0" y="188.0" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#7a6e5e" text-anchor="middle">0.00</text>
<text x="520.0" y="236.0" font-family="Georgia, Times New Roman, serif" font-size="14" fill="#7a6e5e" text-anchor="middle">0.00</text>
<text x="430.0" y="300.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#b44a28" text-anchor="middle">study and hours listen to each other.</text>
<text x="430.0" y="332.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#c4a35a" text-anchor="middle">coffee keeps its own point.</text>
<text x="430.0" y="392.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">look around. mix. that is attention.</text>
</svg>
