<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="360" height="72" role="img" aria-label="datazines">
<defs>
  <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.08"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<g filter="url(#grain)">
  <g transform="rotate(-11 28 40)">
    <rect x="8" y="18" width="36" height="46" rx="4" fill="#4f6d55" opacity="0.22" stroke="#4f6d55" stroke-width="1.6"/>
  </g>
  <g transform="rotate(8 40 38)">
    <rect x="18" y="14" width="36" height="46" rx="4" fill="#3d5f86" opacity="0.18" stroke="#3d5f86" stroke-width="1.6"/>
  </g>
  <rect x="14" y="12" width="38" height="48" rx="4" fill="#f4efe4" stroke="#b44a28" stroke-width="1.8"/>
  <path d="M 20,24 L 44,24" fill="none" stroke="#b44a28" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <path d="M 20,31 L 40,31" fill="none" stroke="#7a6e5e" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  <path d="M 20,38 L 42,38" fill="none" stroke="#7a6e5e" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <ellipse cx="41" cy="52" rx="3.2" ry="2.8" fill="#b44a28" opacity="0.85"/>
</g>
<text x="68" y="42" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="32" fill="#b44a28">datazines</text>
<text x="70" y="60" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="12" fill="#7a6e5e">one idea per page</text>
</svg>
