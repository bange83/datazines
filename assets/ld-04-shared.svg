<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="LDA: same oval, line between. QDA: different ovals, curve between.">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="860" height="400" rx="18" ry="18" fill="#f4efe4"/>
<rect width="860" height="400" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>

<text x="215" y="40" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#241c14" text-anchor="middle">LDA  —  same blob shape</text>
<text x="645" y="40" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#c4a35a" text-anchor="middle">QDA  —  each blob its own</text>

<!-- LDA axes -->
<path d="M 50,328 L 50,64" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<path d="M 42,320 L 360,320" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<path d="M 349,314 L 360,320 L 349,326" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<path d="M 44,75 L 50,64 L 56,75" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<text x="205" y="348" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#241c14" text-anchor="middle">hours</text>
<text x="62" y="56" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#241c14" text-anchor="start">sleep</text>

<!-- LDA: two same-shaped ovals, line between -->
<ellipse cx="130" cy="230" rx="48" ry="40" fill="#b44a28" opacity="0.12" stroke="#b44a28" stroke-width="2"/>
<ellipse cx="250" cy="155" rx="48" ry="40" fill="#3d5f86" opacity="0.12" stroke="#3d5f86" stroke-width="2"/>
<path d="M 95,118 L 310,268" fill="none" stroke="#241c14" stroke-width="2.4" stroke-linecap="round"/>
<text x="205" y="375" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">fence is a line — between the rooms</text>

<!-- QDA axes -->
<path d="M 470,328 L 470,64" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<path d="M 462,320 L 780,320" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<path d="M 769,314 L 780,320 L 769,326" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<path d="M 464,75 L 470,64 L 476,75" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<text x="625" y="348" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#241c14" text-anchor="middle">hours</text>

<!-- QDA: round fail vs wide pass; curve BETWEEN them -->
<ellipse cx="555" cy="245" rx="40" ry="40" fill="#b44a28" opacity="0.12" stroke="#b44a28" stroke-width="2"/>
<ellipse cx="705" cy="128" rx="78" ry="26" fill="#3d5f86" opacity="0.12" stroke="#3d5f86" stroke-width="2"/>
<path d="M 490,88 Q 610,168 635,188 Q 680,228 760,255" fill="none" stroke="#c4a35a" stroke-width="2.6" stroke-linecap="round"/>
<text x="625" y="375" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#c4a35a" text-anchor="middle">fence still between — it just bends</text>
</svg>
