<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="a walker can sit in a smaller dip">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="300" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="300" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<!-- two-dip curve -->
<path d="M 70,80 L 140,160 L 210,120 L 320,230 L 450,90 L 560,140 L 680,70" fill="none" stroke="#241c14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<!-- walker in left dip -->
<ellipse cx="210" cy="120" rx="8" ry="7.4" fill="#b44a28" opacity="0.92"/>
<text x="210" y="100" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="middle">stuck</text>
<!-- true bottom -->
<ellipse cx="450" cy="90" rx="7" ry="6.6" fill="#c4a35a" opacity="0.9"/>
<text x="450" y="72" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#c4a35a" text-anchor="middle">deeper</text>
<text x="380" y="270" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">a line’s bowl has one bottom. uglier scores can have a smaller dip. the walk sits where it walks.</text>
</svg>
