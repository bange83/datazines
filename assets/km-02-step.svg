<text x="120" y="122" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="13" fill="#c4a35a" text-anchor="middle">guess</text>
<ellipse cx="560" cy="185" rx="70" ry="55" fill="#b44a28" opacity="0.10" stroke="#b44a28" stroke-width="1.6"/>
