<text x="567" y="250" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#b44a28" text-anchor="middle">mean of the room</text>
<path d="M 280,180 L 430,180" fill="none" stroke="#c4a35a" stroke-width="2.2" stroke-linecap="round"/>
<path d="M 414,172 L 432,180 L 414,188" fill="none" stroke="#c4a35a" stroke-width="2" stroke-linecap="round"/>
