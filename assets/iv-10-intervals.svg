<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="860" height="390" role="img" aria-label="an estimate with a confidence interval, prediction interval, and Bayesian HDI">
<defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter></defs>
<rect width="860" height="390" rx="18" ry="18" fill="#f4efe4"/>
<rect width="860" height="390" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="430" y="38" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="middle">one estimate. several honest ways to show uncertainty.</text>
<path d="M 110,190 L 750,190" stroke="#241c14" stroke-width="2"/>
<path d="M 270,165 L 590,165" stroke="#3d5f86" stroke-width="14" stroke-linecap="round" opacity="0.3"/>
<path d="M 175,215 L 685,215" stroke="#b44a28" stroke-width="14" stroke-linecap="round" opacity="0.22"/>
<path d="M 330,265 L 520,265" stroke="#4f6d55" stroke-width="14" stroke-linecap="round" opacity="0.3"/>
<path d="M 430,135 L 430,300" stroke="#241c14" stroke-width="2.4" stroke-dasharray="7 6"/>
<text x="430" y="112" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="22" fill="#241c14" text-anchor="middle">estimate</text>
<text x="430" y="155" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#3d5f86" text-anchor="middle">mean CI</text>
<text x="430" y="208" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="middle">new-person prediction</text>
<text x="430" y="258" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#4f6d55" text-anchor="middle">Bayesian HDI</text>
<text x="430" y="350" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#7a6e5e" text-anchor="middle">name the question before you name the range.</text>
</svg>
