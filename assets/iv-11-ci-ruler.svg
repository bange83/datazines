<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="a mean estimate with a confidence interval from 4.18 to 5.57">
<defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter></defs>
<rect width="760" height="300" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="300" rx="18" ry="300" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="40" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="middle">solo mean = 4.88. eight students leave a range.</text>
<path d="M 80,170 L 680,170" stroke="#241c14" stroke-width="2"/>
<path d="M 250,145 L 530,145" stroke="#3d5f86" stroke-width="16" stroke-linecap="round" opacity="0.32"/>
<path d="M 250,125 L 250,165 M 530,125 L 530,165" stroke="#3d5f86" stroke-width="2.5"/>
<path d="M 390,112 L 390,190" stroke="#b44a28" stroke-width="3"/>
<text x="250" y="215" font-family="Georgia, serif" font-size="17" fill="#3d5f86" text-anchor="middle">4.18</text>
<text x="390" y="215" font-family="Georgia, serif" font-size="17" fill="#b44a28" text-anchor="middle">4.88</text>
<text x="530" y="215" font-family="Georgia, serif" font-size="17" fill="#3d5f86" text-anchor="middle">5.57</text>
<text x="390" y="260" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#7a6e5e" text-anchor="middle">95% confidence interval for the population mean</text>
</svg>
