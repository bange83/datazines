<path d="M 140.00,250.00 L 175.01,222.51 Q 175.01,222.51 192.48,208.73 Q 209.95,194.94 227.49,181.24 Q 245.03,167.53 262.51,153.77 L 280.00,140.00" fill="none" stroke="#b44a28" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
