<text x="290.0" y="130.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#b44a28" text-anchor="start">steep  →  big step</text>
<ellipse cx="520.0" cy="115.0" rx="7.5" ry="7.5" transform="rotate(24.8 520.0 115.0)" fill="#c4a35a" opacity="0.9"/>
<path d="M 470.00,125.00 L 510.02,119.45 Q 510.02,119.45 530.01,116.55 Q 550.00,113.66 570.00,110.83 L 590.00,108.00" fill="none" stroke="#c4a35a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<text x="600.0" y="100.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#c4a35a" text-anchor="start">flat  →  tiny step</text>
<text x="360.0" y="330.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">gradient = which way is downhill, and how steep.</text>
