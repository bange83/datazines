<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Bonferroni divides the alpha error budget among tests">
<defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.07"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter></defs>
<rect width="760" height="300" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="300" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="38" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="middle">one α budget. three questions.</text>
<path d="M 85,105 L 675,105" stroke="#241c14" stroke-width="10" stroke-linecap="round"/>
<path d="M 282,105 L 282,185 M 478,105 L 478,185" stroke="#f4efe4" stroke-width="5"/>
<path d="M 85,105 L 85,145 M 675,105 L 675,145" stroke="#241c14" stroke-width="2"/>
<text x="380" y="88" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="21" fill="#b44a28" text-anchor="middle">α = 0.05 family budget</text>
<text x="183" y="160" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#3d5f86" text-anchor="middle">0.0167</text>
<text x="380" y="160" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#3d5f86" text-anchor="middle">0.0167</text>
<text x="577" y="160" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#3d5f86" text-anchor="middle">0.0167</text>
<text x="380" y="235" font-family="Georgia, serif" font-size="18" fill="#7a6e5e" text-anchor="middle">0.05 / 3  =  0.0167 for each look</text>
</svg>
