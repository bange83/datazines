<path d="M 450,116.0 L 472.4,116.0 L 472.4,144.0 L 450,144.0 Z" fill="#b44a28" stroke="#b44a28" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.25"/>
<text x="484.4" y="136.0" font-family="Georgia, Times New Roman, serif" font-size="16" fill="#b44a28" text-anchor="start">0.08</text>
