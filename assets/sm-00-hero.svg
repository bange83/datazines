<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" role="img" aria-label="softmax turns scores into shares">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="860" height="380" rx="18" ry="18" fill="#f4efe4"/>
<rect width="860" height="380" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="430.0" y="40.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="middle">three scores  →  three probabilities that add to 1</text>
<text x="140.0" y="90.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#7a6e5e" text-anchor="middle">scores</text>
<text x="70.0" y="136.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28" text-anchor="start">fail</text>
<text x="200.0" y="136.0" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#b44a28" text-anchor="start">-1.2</text>
<text x="70.0" y="191.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#c4a35a" text-anchor="start">pass</text>
<text x="200.0" y="191.0" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#c4a35a" text-anchor="start">+0.8</text>
<text x="70.0" y="246.0" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#3d5f86" text-anchor="start">honors</text>
<text x="200.0" y="246.0" font-family="Georgia, Times New Roman, serif" font-size="18" fill="#3d5f86" text-anchor="start">+0.1</text>
