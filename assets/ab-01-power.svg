<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="Statistical Power: Alpha false alarm vs Beta miss">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.07"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" mode="multiply"/>
  </filter>
</defs>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4"/>
<rect width="760" height="420" rx="18" ry="18" fill="#f4efe4" filter="url(#grain)" opacity="0.9"/>
<text x="380" y="38" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#7a6e5e" text-anchor="middle">power is the chance to catch a real effect. beta is the miss.</text>

<!-- Baseline axis -->
<path d="M 60,340 L 700,340" fill="none" stroke="#241c14" stroke-width="2"/>
<text x="690" y="365" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#241c14">observed diff</text>

<!-- H0 Curve (blue, centered at x=240) -->
<path d="M 100,340 Q 240,80 380,340" fill="none" stroke="#3d5f86" stroke-width="2.2"/>
<text x="240" y="210" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#3d5f86" text-anchor="middle">H0: no difference</text>
<text x="240" y="365" font-family="Georgia" font-size="14" fill="#3d5f86" text-anchor="middle">0</text>

<!-- Critical line (decision threshold) at x=340 -->
<path d="M 340,360 L 340,90" fill="none" stroke="#241c14" stroke-width="1.8" stroke-dasharray="5,5"/>
<text x="340" y="80" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="15" fill="#241c14" text-anchor="middle">critical cut (α = 5%)</text>

<!-- Alpha tail (rust) -->
<path d="M 340,340 Q 355,275 380,340 Z" fill="#b44a28" opacity="0.35"/>
<text x="365" y="325" font-family="Georgia" font-size="13" fill="#b44a28">α = 5%</text>

<!-- H1 Curve (sage/gold, centered at x=480) -->
<path d="M 320,340 Q 480,80 640,340" fill="none" stroke="#4f6d55" stroke-width="2.2"/>
<text x="490" y="160" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#4f6d55" text-anchor="middle">H1: true effect (MDE)</text>
<text x="480" y="365" font-family="Georgia" font-size="14" fill="#4f6d55" text-anchor="middle">+6%</text>

<!-- Beta region (left of cut under H1) -->
<path d="M 320,340 Q 330,310 340,270 L 340,340 Z" fill="#7a6e5e" opacity="0.4"/>
<text x="315" y="260" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="14" fill="#7a6e5e" text-anchor="end">β = 20% (miss)</text>

<!-- Power region (right of cut under H1) -->
<text x="500" y="230" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#4f6d55" text-anchor="middle">Power = 1 − β = 80%</text>
<text x="500" y="255" font-family="Georgia" font-size="14" fill="#7a6e5e" text-anchor="middle">(chance to shout yes when true)</text>
</svg>