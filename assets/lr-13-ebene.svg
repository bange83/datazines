<ellipse cx="155" cy="252" rx="5.8" ry="6.3" transform="rotate(-8 155 252)" fill="#241c14" opacity="0.92"/>
<ellipse cx="188" cy="210" rx="6.4" ry="5.9" transform="rotate(16 188 210)" fill="#241c14" opacity="0.92"/>
<ellipse cx="230" cy="198" rx="6.0" ry="6.4" transform="rotate(-11 230 198)" fill="#241c14" opacity="0.92"/>
<ellipse cx="262" cy="168" rx="6.2" ry="6.1" transform="rotate(7 262 168)" fill="#241c14" opacity="0.92"/>

<!-- right: a plane -->
<text x="545" y="42" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="20" fill="#7a6e5e" text-anchor="middle">two x  →  a plane</text>
<!-- floor -->
<path d="M 545,210 L 700,275 L 545,340 L 390,275 Z" fill="#efe6d4" stroke="#241c14" stroke-width="1.6" stroke-linejoin="round"/>
<!-- axes from the near-center of the floor -->
<path d="M 545,210 L 545,78" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<path d="M 539,94 L 545,78 L 551,94" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<text x="533" y="74" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="end">grade</text>
<path d="M 545,210 L 710,278" fill="none" stroke="#241c14" stroke-width="1.8" stroke-linecap="round"/>
<text x="716" y="292" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14">hours</text>
<path d="M 545,210 L 378,278" fill="none" stroke="#241c14" stroke-width="1.8" stroke-linecap="round"/>
<text x="368" y="294" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="end">sleep</text>
<!-- plane sheet, sitting above the floor, rust -->
<path d="M 455,168 L 640,148 L 655,228 L 470,248 Z" fill="#b44a28" stroke="#b44a28" stroke-width="2.2" opacity="0.22"/>
<path d="M 455,168 L 640,148 L 655,228 L 470,248 Z" fill="none" stroke="#b44a28" stroke-width="2.2" stroke-linejoin="round"/>
<text x="662" y="140" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="18" fill="#b44a28">the plane</text>
<!-- dots near the plane -->
<ellipse cx="500" cy="175" rx="6.2" ry="6.5" transform="rotate(9 500 175)" fill="#241c14" opacity="0.92"/>
<ellipse cx="560" cy="158" rx="5.9" ry="6.2" transform="rotate(-14 560 158)" fill="#241c14" opacity="0.92"/>
<ellipse cx="590" cy="195" rx="6.3" ry="5.8" transform="rotate(11 590 195)" fill="#241c14" opacity="0.92"/>
