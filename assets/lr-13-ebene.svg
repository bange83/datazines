<path d="M 296,314 L 310,320 L 296,326" fill="none" stroke="#241c14" stroke-width="2" stroke-linecap="round"/>
<text x="64" y="62" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14" text-anchor="end">grade</text>
<text x="318" y="326" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="16" fill="#241c14">hours</text>
