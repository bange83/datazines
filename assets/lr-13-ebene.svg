<text x="380" y="392" font-family="Bradley Hand, Apple Chancery, Segoe Script, Comic Sans MS, cursive" font-size="17" fill="#7a6e5e" text-anchor="middle">same job. one more lever. still flat — just a sheet now.</text>
</svg>
